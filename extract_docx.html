<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DOCX Text Extractor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: monospace; white-space: pre-wrap; word-wrap: break-word; padding: 20px; }
        #output { width: 100%; min-height: 400px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; }
        .error { color: red; }
        input[type=file] { margin: 10px 0; }
        #status { color: blue; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>DOCX Text Extractor</h2>
    <div>
        <label for="fileInput">Select a .docx file:</label>
        <input type="file" id="fileInput" accept=".docx">
    </div>
    <div id="status">Waiting for file...</div>
    <hr>
    <div id="output"></div>

    <script>
        const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

        function extractTextFromXml(xmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(xmlString, 'text/xml');

            const parseError = doc.querySelector('parsererror');
            if (parseError) {
                return 'XML Parse Error: ' + parseError.textContent;
            }

            let result = [];
            const paragraphs = doc.getElementsByTagNameNS(W_NS, 'p');
            for (let i = 0; i < paragraphs.length; i++) {
                let paraText = extractParaText(paragraphs[i]);
                result.push(paraText);
            }
            return result.join('\n');
        }

        function extractParaText(paraNode) {
            let text = '';
            function walk(node) {
                for (let child of node.childNodes) {
                    if (child.nodeType === Node.ELEMENT_NODE) {
                        const localName = child.localName;
                        if (localName === 't') {
                            text += child.textContent || '';
                        } else if (localName === 'tab') {
                            text += '\t';
                        } else if (localName === 'br' || localName === 'cr') {
                            text += '\n';
                        } else {
                            walk(child);
                        }
                    }
                }
            }
            walk(paraNode);
            return text;
        }

        async function processDocx(file) {
            document.getElementById('status').textContent = 'Processing...';
            document.getElementById('output').textContent = '';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const zip = await JSZip.loadAsync(arrayBuffer);

                const docFile = zip.file('word/document.xml');
                if (!docFile) {
                    throw new Error('word/document.xml not found in archive');
                }
                const xmlContent = await docFile.async('string');

                const text = extractTextFromXml(xmlContent);

                let footnotesText = '';
                const footnotesFile = zip.file('word/footnotes.xml');
                if (footnotesFile) {
                    const fnXml = await footnotesFile.async('string');
                    footnotesText = extractTextFromXml(fnXml);
                }

                let endnotesText = '';
                const endnotesFile = zip.file('word/endnotes.xml');
                if (endnotesFile) {
                    const enXml = await endnotesFile.async('string');
                    endnotesText = extractTextFromXml(enXml);
                }

                let fullText = text;
                if (footnotesText.trim()) {
                    fullText += '\n\n--- Footnotes ---\n' + footnotesText;
                }
                if (endnotesText.trim()) {
                    fullText += '\n\n--- Endnotes ---\n' + endnotesText;
                }

                document.getElementById('output').textContent = fullText;
                document.getElementById('status').textContent = 'Done! (' + fullText.length + ' characters)';
            } catch (e) {
                document.getElementById('status').textContent = 'Error: ' + e.message;
                document.getElementById('output').innerHTML = '<span class="error">' + e.message + '</span>';
            }
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                processDocx(file);
            }
        });
    </script>
</body>
</html>
